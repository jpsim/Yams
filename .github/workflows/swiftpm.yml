name: SwiftPM

on:
  push:
    branches: [main]
    paths:
      - '.codecov.yml'
      - '.github/workflows/swiftpm.yml'
      - 'Package*'
      - 'Sources/**/*.[ch]'
      - 'Sources/**/*.swift'
      - 'Sources/**/module.modulemap'
      - 'Tests/**/*.swift'
      - 'Tests/**/*.ya?ml'
  pull_request:
    paths:
      - '.codecov.yml'
      - '.github/workflows/swiftpm.yml'
      - 'Package*'
      - 'Sources/**/*.[ch]'
      - 'Sources/**/*.swift'
      - 'Sources/**/module.modulemap'
      - 'Tests/**/*.swift'
      - 'Tests/**/*.ya?ml'

concurrency:
  group: swiftpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Xcode_Sequoia:
    name: macOS 15 with Xcode ${{ matrix.xcode_version }}
    strategy:
      matrix:
        xcode_version: ['16.4']
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode_version }}.app
    steps:
      - uses: actions/checkout@v6.0.2
      - run: swift -version
      - run: YAMS_DEFAULT_ENCODING=UTF16 swift test --parallel
      - run: YAMS_DEFAULT_ENCODING=UTF8 swift test --parallel

  Xcode_Tahoe:
    name: macOS 26 with Xcode ${{ matrix.xcode_version }}
    strategy:
      matrix:
        xcode_version: ['26.5']
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode_version }}.app
    steps:
      - uses: actions/checkout@v6.0.2
      - run: swift -version
      - run: YAMS_DEFAULT_ENCODING=UTF16 swift test --parallel
      - run: YAMS_DEFAULT_ENCODING=UTF8 swift test --parallel
  Linux:
    name: Linux with Swift ${{ matrix.tag }}
    strategy:
      matrix:
        tag: ['5.7', '5.8', '5.9', '5.10', '6.0', '6.1', '6.3.2']
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v6.0.2
      - run: YAMS_DEFAULT_ENCODING=UTF16 swift test --parallel
      - run: YAMS_DEFAULT_ENCODING=UTF8 swift test --parallel

  Windows:
    name: Windows with Swift ${{ matrix.swift_version }}
    runs-on: windows-latest
    strategy:
      matrix:
        swift_version: ['6.2', '6.3.2']
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift_version }}
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
  Android:
    name: Android with Swift ${{ matrix.tag }}
    strategy:
      matrix:
        tag: ['6.3']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: skiptools/swift-android-action@2044b79660f201ccef8cbce62877e4ec5409f9c8 # v2.9.5
        with:
          swift-version: ${{ matrix.tag }}
          android-api-level: 35
          # needed for tests that use fixturesDirectory
          copy-files: Tests
          test-env: TEST_WORKSPACE=1

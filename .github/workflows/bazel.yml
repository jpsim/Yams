name: Bazel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bazel.yml'
      - 'Sources/**/*.[ch]'
      - 'Sources/**/*.swift'
      - 'Tests/**/*.swift'
      - 'Tests/**/*.ya?ml'
      - '**/BUILD'
      - 'MODULE.bazel'
      - 'WORKSPACE'
      - '.bazelrc'
      - '.bazelversion'
  pull_request:
    paths:
      - '.github/workflows/bazel.yml'
      - 'Sources/**/*.[ch]'
      - 'Sources/**/*.swift'
      - 'Tests/**/*.swift'
      - 'Tests/**/*.ya?ml'
      - '**/BUILD'
      - 'MODULE.bazel'
      - 'WORKSPACE'
      - '.bazelrc'
      - '.bazelversion'

concurrency:
  group: bazel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macOS:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Apple tests
        run: bazelisk test //Tests/...
  Linux:
    strategy:
      matrix:
        tag: ['6.2', '6.3.2']
    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Yams tests
        run: bazel test --test_output=all //Tests:UnitTests
  Windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: '6.3.2'
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.x
      - name: Yams tests
        # The fixture tests read files relative to the runfiles directory.
        run: bazel.exe test --enable_runfiles //Tests:UnitTests
